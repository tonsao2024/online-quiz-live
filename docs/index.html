<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#46178f" />
<title>ONLIVE QUIZ — เกมตอบคำถามสดสำหรับการอบรม</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2346178f'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>Q</text></svg>" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="theme-join">

<div class="k-page">

  <header class="k-topbar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div class="brand-name">Onlive Quiz</div>
    </div>
    <button class="k-link" id="toggle-host">สำหรับผู้จัด</button>
  </header>

  <main class="k-main">
    <div class="k-logo-big"><span>onlive</span> <em>quiz</em></div>

    <form class="k-join" id="join-form" autocomplete="off">
      <input id="pin-input" class="k-input" inputmode="numeric" maxlength="6"
             placeholder="Game PIN" aria-label="Game PIN" />
      <button class="btn-enter" type="submit">Enter</button>
    </form>

    <p class="k-note">กรอก PIN ที่เห็นบนจอผู้จัด · ไม่ต้องสมัครสมาชิก</p>

    <!-- ============ ผู้จัด ============ -->
    <div class="k-host hidden" id="host">
      <div class="card">
        <div class="card-head">
          <div class="card-title">สำหรับผู้จัด / แอดมิน</div>
          <span class="pill" id="host-badge">ต้องเข้าสู่ระบบ</span>
        </div>
        <div class="tabs" id="auth-tabs" style="margin-bottom:14px">
          <button data-mode="login" class="on">เข้าสู่ระบบ</button>
          <button data-mode="signup">สมัครใหม่</button>
        </div>
        <form id="auth-form" class="col" style="gap:12px">
          <label class="field" style="margin:0"><span>อีเมล</span>
            <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required />
          </label>
          <label class="field" style="margin:0"><span>รหัสผ่าน</span>
            <input id="password" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" />
          </label>
          <button class="btn-enter" id="auth-submit" type="submit">เข้าสู่ระบบ</button>
        </form>
        <p class="tiny muted" style="margin-top:12px; line-height:1.6">
          บัญชีผู้จัดใช้สร้างชุดข้อสอบ เปิดห้อง และคุมเกม
        </p>
      </div>
    </div>
  </main>

  <footer class="tc" style="padding:10px 0 4px; color:rgba(255,255,255,.6); font-size:11.5px; font-weight:700">
    ONLIVE QUIZ · GitHub Pages + Supabase
  </footer>
</div>

<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/page-index.js"></script>
</body>
</html>
